<ng-template #overflowSection>
  <div class="settings-buttons-container">
    <div class="settings-title">Chart Settings</div>
    <div *ngFor="let group of settingsGroups" class="setting-group">
      <div class="setting-title">{{ group.title }}</div>
      <widget-configuration-button
        *ngFor="let button of group.buttons"
        [buttonConfiguration]="button"
        [rowMode]="true"
        [ngStyle]="{
          display: button.type !== 'divider' ? 'block' : 'none',
          margin: button.margin,
        }"
      >
      </widget-configuration-button>
    </div>
  </div>
</ng-template>

<ng-template #defaultOverflowSection>
  <div class="default-overflow"></div>
</ng-template>

<div
  class="widget {{ isWidgetHighlighted ? 'highlight' : '' }} {{
    isWidgetTargeted ? 'targeted' : ''
  }}"
  [attr.aria-label]="_activeWidget"
>
  <header *ngIf="!exportMode">
    <widget-switcher
      *ngIf="!disableSwitch"
      [widgetId]="widgetLayoutConfig.id"
      [walkthroughId]="walkthroughPrefix ? walkthroughPrefix + '-chart-switcher' : ''"
      (walkthroughNext)="widgetSwitcher.openOverlay()"
      [widgetOptions]="allWidgetOptions"
      [activeWidgetType]="activeWidget"
      [description]="widgetConfiguration?.description"
      (widgetChange)="activeWidget = $event"
      #widgetSwitcher
    >
    </widget-switcher>
    <walkthrough-info-button *ngIf="!disableSwitch" [feature]="'chart-' + activeWidget" [scope]="widgetLayoutConfig.id"></walkthrough-info-button>
    <div
      class="widget-title"
      *ngIf="disableSwitch && title.length > 0"
      [title]="title"
    >
      {{ title }}
    </div>
    <div class="print-only-title">
      {{ getWidgetDisplayTitle() }}
    </div>

    <div class="buttons" #buttonsContainer>
      <div
        class="top-toolbar {{ showTopToolbar ? 'visible' : 'hidden' }}"
        #topToolbar
      >
        <widget-configuration-button
          *ngFor="let button of topToolbarButtons"
          [location]="'top-toolbar'" [walkthroughScope]="widgetLayoutConfig.id"
          [buttonConfiguration]="button"
          [ngStyle]="{
            display: button._overflowed ? 'none' : 'block',
            margin: button.margin,
          }"
        ></widget-configuration-button>
      </div>
      <widget-settings-menu
        class="settings-menu-trigger-btn"
        (walkthroughEnter)="settingsButton.open()"
        (walkthroughLeave)="settingsButton.close()"
        [walkthroughId]="['chart-settings', walkthroughPrefix ? `${walkthroughPrefix}-chart-settings` : '']"
        [walkthroughScope]="widgetLayoutConfig.id"
        *ngIf="settingsMenu || isOverflowed"
        [settingsDialog]="settingsMenu || defaultOverflowSection"
        [noPadding]="true"
        [overflowSection]="overflowSection"
        #settingsButton
      >
        <div class="settings-button-container">
          <icon-button
            #tooltip="matTooltip"
            matTooltip="Show Settings Menu"
            icon="assets/button-icons/settings.svg"
          ></icon-button>
          <icon-button icon="assets/button-icons/arrow-down.svg"></icon-button>
        </div>
      </widget-settings-menu>
    </div>
  </header>
  <div
    class="visualization {{
      bottomToolbarButtons.length > 0 ? '' : 'hide-overflow'
    }} {{ exportMode ? 'export-mode' : '' }}"
    (contextmenu)="onContextMenu($event)"
  >
    <div *ngIf="isWidgetDataLoading" class="loading-overlay">
      <wait-spinner
        #tooltip="matTooltip"
        [matTooltip]="'Loading...'"
      ></wait-spinner>
    </div>

    <widget-configuration-button
      *ngIf="!exportMode"
      [location]="'top-left'" [walkthroughScope]="widgetLayoutConfig.id"
      class="inset-button top-left"
      [ngStyle]="
        topLeftInsetButton?.margin ? { margin: topLeftInsetButton?.margin } : {}
      "
      [buttonConfiguration]="topLeftInsetButton"
    ></widget-configuration-button>
    <widget-configuration-button
      *ngIf="!exportMode"
      [location]="'top-center'" [walkthroughScope]="widgetLayoutConfig.id"
      class="inset-button top-center"
      [ngStyle]="
        topCenterInsetButton?.margin
          ? { margin: topCenterInsetButton?.margin }
          : {}
      "
      [buttonConfiguration]="topCenterInsetButton"
    ></widget-configuration-button>
    <widget-configuration-button
      *ngIf="!exportMode"
      class="inset-button top-right" [walkthroughScope]="widgetLayoutConfig.id"
      [ngStyle]="
        topRightInsetButton?.margin
          ? { margin: topRightInsetButton?.margin }
          : {}
      "
      [buttonConfiguration]="topRightInsetButton"
    ></widget-configuration-button>

    <ng-template #currentWidget></ng-template>

    <widget-configuration-button
      *ngIf="!exportMode"
      [location]="'bottom-left'" [walkthroughScope]="widgetLayoutConfig.id"
      class="inset-button bottom-left"
      [ngStyle]="
        bottomLeftInsetButton?.margin
          ? { margin: bottomLeftInsetButton?.margin }
          : {}
      "
      [buttonConfiguration]="bottomLeftInsetButton"
    ></widget-configuration-button>
    <widget-configuration-button
      *ngIf="!exportMode"
      [location]="'bottom-right'" [walkthroughScope]="widgetLayoutConfig.id"
      class="inset-button bottom-right"
      [ngStyle]="
        bottomRightInsetButton?.margin
          ? { margin: bottomRightInsetButton?.margin }
          : {}
      "
      [buttonConfiguration]="bottomRightInsetButton"
    ></widget-configuration-button>
  </div>
  <div
    class="bottom-toolbar {{ showBottomToolbar ? 'visible' : 'hidden' }}"
    #bottomToolbar
    *ngIf="!exportMode"
  >
    <widget-configuration-button
      *ngFor="let button of bottomToolbarButtons"
      [location]="'bottom-toolbar'" [walkthroughScope]="widgetLayoutConfig.id"
      [ngClass]="{ 'bottom-toolbar-button': button.type !== 'divider' }"
      [buttonConfiguration]="button"
      [ngStyle]="{ margin: button.margin }"
    ></widget-configuration-button>
  </div>
</div>
